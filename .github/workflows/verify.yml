name: Reproduction hors ligne
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python reproduce.py
      - name: Vérifier les preuves déterministes
        run: git diff --exit-code -- evidence/*.csv evidence/summary.json evidence/shared-wrong-values.json evidence/quorums.json
